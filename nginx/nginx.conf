# ────────────────────────────────────────────────────────────────────
# IPAM Multi-Cloud Scanner — Production Reverse Proxy (Nginx)
#
# Routes:
#   /api/        → FastAPI backend
#   /ws/         → FastAPI WebSocket (upgraded)
#   /            → React frontend static build
#
# TLS terminates at nginx; backend traffic is plain HTTP on the
# private docker network. Authentication is enforced by JWT in the
# FastAPI backend (no HTTP-level auth gate here).
# ────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # ── Upstreams ──────────────────────────────────────────────────
    upstream backend {
        server app:8000;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server (TLS termination) ─────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # ── TLS certificate & key ──────────────────────────────────
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # ── Modern TLS settings ────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ── Request logging ───────────────────────────────────────
        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;

        # ── Security headers ──────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── API proxy ─────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for long-running scan requests.
            proxy_connect_timeout 60s;
            proxy_read_timeout    300s;
            proxy_send_timeout    60s;

            # Buffer settings.
            proxy_buffering on;
            proxy_buffer_size   4k;
            proxy_buffers       8 4k;

            # Enlarge max body size for large scan config payloads.
            client_max_body_size 10M;
        }

        # ── WebSocket proxy ────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts (long-lived connections).
            proxy_connect_timeout 60s;
            proxy_read_timeout    86400s;
            proxy_send_timeout    60s;
        }

        # ── API docs (dev only — consider disabling in production) ─
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /redoc {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Frontend static files ──────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively.
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
