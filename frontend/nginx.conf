# ────────────────────────────────────────────────────────────────────
# IPAM Scanner Frontend — nginx config for the SPA container.
#
# Mounted at /etc/nginx/conf.d/default.conf inside the nginx:alpine image.
#
# Responsibilities:
#   • Terminate TLS on 443 (certs mounted at /etc/nginx/certs).
#   • Redirect HTTP (80) → HTTPS.
#   • Serve the Vite production build with SPA fallback
#     (try_files → index.html) so client-side routes resolve on direct
#     load or refresh.
#   • Reverse-proxy /api/ and /ws/ to the FastAPI backend on the
#     docker network so the browser can talk to a single origin.
#
# The top-level events{} and http{} blocks are provided by the nginx
# image's /etc/nginx/nginx.conf; this file only contributes a server.
# ────────────────────────────────────────────────────────────────────

upstream ipam_backend {
    server app:8000;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS server (TLS termination + SPA + API proxy) ───────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # TLS certificate & key (mounted read-only from ./nginx/certs).
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Modern TLS settings.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip text-based assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # ── API proxy → FastAPI ────────────────────────────────────────
    location /api/ {
        proxy_pass http://ipam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size   4k;
        proxy_buffers       8 4k;

        client_max_body_size 10M;
    }

    # ── WebSocket proxy → FastAPI ──────────────────────────────────
    location /ws/ {
        proxy_pass http://ipam_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    60s;
    }

    # ── SPA static files ───────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive, immutable caching for hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No-cache for the entry document so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Favicon and other root-level static files.
    location ~* \.(svg|ico|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
