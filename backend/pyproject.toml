[project]
name = "ipam-scanner"
version = "1.0.0"
description = "Multi-Cloud IPAM Security Scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "IPAM Multicloud Team" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.0.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-nmap>=0.7.0",
    "boto3>=1.35.0",
    "azure-mgmt-network>=29.0.0",
    "azure-mgmt-resource>=23.1.0",
    "azure-identity>=1.19.0",
    "oci>=2.130.0",
    "google-cloud-compute>=1.19.0",
    "cryptography>=43.0.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "ruff>=0.6.0",
    "mypy>=1.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]
# UP046 (PEP 695 generic classes) is ignored because the project's mypy
# toolchain runs on Python 3.11, whose parser cannot handle PEP 695
# syntax (`class Foo[T]`). The classic `TypeVar` + `Generic[T]` style
# is used instead for compatibility.
ignore = ["B008", "C408", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
explicit_package_bases = true
namespace_packages = true
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "azure.*",
    "oci.*",
    "google.*",
    "nmap.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=xml"
